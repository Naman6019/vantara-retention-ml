services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: vantara_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vantara_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vantara_retail}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vantara_user} -d ${POSTGRES_DB:-vantara_retail}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-off batch scorer: populates predictions, segments and recommendations
  scorer:
    build: .
    container_name: vantara_scorer
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["python", "-m", "src.serving.batch_score"]

  # Backend REST API (FastAPI)
  api:
    build: .
    container_name: vantara_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      scorer:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Frontend Dashboard (Streamlit) — talks only to the API
  dashboard:
    build: .
    container_name: vantara_dashboard
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: ${API_URL:-http://api:8000}
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "frontend/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  postgres_data:
